name: build
on: [pull_request]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: moderate

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Install required system libraries so -sys crates pass build.rs pkg-config checks
      - name: Install System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config build-essential cmake meson ninja-build \
            libssl-dev libde265-dev libx265-dev libopenjp2-7-dev \
            libdav1d-dev libaom-dev libheif-dev \
            libjpeg-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libxxhash-dev

      # 1. Setup the toolchain first
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          profile: minimal

      # 2. Initialize cache
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 3. Log usage
      - name: Log Cache Usage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Total Active Cache Size:"
          gh api /repos/${{ github.repository }}/actions/cache/usage | jq -r '.active_caches_size_in_bytes / 1024 / 1024 | "Approx \(. | floor) MB"'

      # 4. Perform the check
      - name: Run Check
        run: cargo check --locked
